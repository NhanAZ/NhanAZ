name: Update follower count

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-follower-count
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README and thank-you page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_followers.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md docs/index.html data/followers-history.json
          then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html data/followers-history.json
          git commit -m "docs: archive follower snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
