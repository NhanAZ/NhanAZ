name: Deploy thank-you page

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - Update follower count
    types:
      - completed
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v9
        with:
          script: |
            const deadline = Date.now() + 120_000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const artifact = data.artifacts.find(item => item.name === "github-pages" && !item.expired);

              if (artifact) {
                core.info(`Pages artifact ${artifact.id} is available.`);
                return;
              }

              core.info("Pages artifact is not listed yet. Retrying in 2 seconds.");
              await new Promise(resolve => setTimeout(resolve, 2_000));
            }

            core.setFailed("Timed out waiting for the GitHub Pages artifact to become visible.");

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
